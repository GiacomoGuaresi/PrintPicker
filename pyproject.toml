[project]
name = "printpicker"
version = "0.1.0"
description = "Pick the best shots from your photo archive and get them ready for print."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giacomo Guaresi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=11",
    "pillow-heif>=0.18",
    "rawpy>=0.21",
]

[project.urls]
Repository = "https://github.com/GiacomoGuaresi/PrintPicker"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printpicker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
