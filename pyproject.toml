[project]
name = "printpicker"
dynamic = ["version"]
description = "Pick the best shots from your photo archive and get them ready for print."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giacomo Guaresi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pillow>=11",
    "pillow-heif>=0.18",
    "pyside6>=6.7",
    "rawpy>=0.21",
]

[project.gui-scripts]
printpicker = "printpicker.ui.app:main"

[project.urls]
Repository = "https://github.com/GiacomoGuaresi/PrintPicker"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/printpicker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/printpicker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
