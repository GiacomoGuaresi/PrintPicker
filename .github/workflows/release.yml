name: Release

# Pushing a tag like v1.0.0 builds the app on every platform and publishes a GitHub release.
# Running the workflow by hand only builds and keeps the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: PrintPicker-macos-arm64.zip
          - os: windows-latest
            archive: PrintPicker-windows-x64.zip
          - os: ubuntu-latest
            archive: PrintPicker-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked --all-groups
      - run: uv run pyinstaller packaging/printpicker.spec --noconfirm

      - name: Self-test and archive (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/PrintPicker.app/Contents/MacOS/PrintPicker --self-test
          ditto -c -k --keepParent dist/PrintPicker.app "${{ matrix.archive }}"
      - name: Self-test and archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist/PrintPicker/PrintPicker.exe -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path dist/PrintPicker -DestinationPath "${{ matrix.archive }}"
      - name: Self-test and archive (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/PrintPicker/PrintPicker --self-test
          tar -czf "${{ matrix.archive }}" -C dist PrintPicker

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          generate_release_notes: true
